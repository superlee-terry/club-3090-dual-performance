# ===========================================================================
# Profile (at-a-glance):
#   Model:     Qwen3.6-27B (Lorbus AutoRound INT4 + BF16 mtp.fc preserved)
#   Topology:  Dual 3090 (TP=2, NVLink auto-detected via NVLINK_MODE)
#   Drafter:   z-lab DFlash N=5 (block-diffusion drafter)
#   KV:        fp8_e5m2 (forced bf16 for drafter via --dtype bfloat16)
#   Vision:    yes
#   Max ctx:   185K
#   Genesis:   none
#   Status:    Production (standalone deployment)
#   Best for:  Peak code TPS with vision (AL ~4.4 vs MTP's 3.4)
# ---------------------------------------------------------------------------
# Self-contained compose — all paths relative to docker/ root.
# Expected TPS: ~82 narr / 125 code @ 185K ctx on 2x RTX 3090 PCIe.
#
# Prerequisites:
#   1. Edit .env (copy from .env.example)
#   2. bash scripts/download.sh   (downloads main model + DFlash draft)
#   3. docker compose -f compose/dflash.yml up -d
# ===========================================================================

services:
  vllm-qwen36-27b-dflash:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:nightly-e47c98ef7a38792996e452ef53914e21e41928e9}
    container_name: "${CONTAINER_NAME:-vllm-qwen36-27b-dflash}"
    restart: "no"
    ports:
      - "${BIND_HOST:-0.0.0.0}:${PORT:-8012}:8000"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      # --- Model weights ---
      - ../models:/root/.cache/huggingface
      # --- JIT compile caches ---
      - ../cache/torch_compile:/root/.cache/vllm/torch_compile_cache
      - ../cache/triton:/root/.triton/cache
      # --- Patches ---
      # Marlin pad-sub-tile-n (vLLM PR #40361)
      - ../patches/vllm-marlin-pad/marlin.py:/usr/local/lib/python3.12/dist-packages/vllm/model_executor/kernels/linear/mixed_precision/marlin.py:ro
      - ../patches/vllm-marlin-pad/MPLinearKernel.py:/usr/local/lib/python3.12/dist-packages/vllm/model_executor/kernels/linear/mixed_precision/MPLinearKernel.py:ro
      # PR #35936 required-tool fallback — skipped on nightly >= aa2b56ff (upstream restructured, patch breaks import)
      # - ../patches/vllm-pr35936/vllm/entrypoints/openai/chat_completion/serving.py:/etc/club3090/pr35936-chat-completion-serving.py:ro
      # - ../patches/vllm-pr35936/vllm/entrypoints/openai/engine/serving.py:/etc/club3090/pr35936-engine-serving.py:ro
      # - ../patches/vllm-pr35936/install.sh:/etc/club3090/install-pr35936.sh:ro
      # PR #41800 truncate_prompt_tokens fix
      - ../patches/vllm-pr41800/install.sh:/etc/club3090/install-pr41800.sh:ro
      # Fixed chat template (7 bug fixes)
      - ../patches/chat-template/chat_template.jinja:/etc/qwen-froggeric-chat-template.jinja:ro
      # NVLink auto-detection
      - ../scripts/detect_nvlink.sh:/etc/club3090/detect_nvlink.sh:ro
    environment:
      - NVIDIA_VISIBLE_DEVICES=${GPUS:-all}
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
      - HF_HUB_OFFLINE=true
      - VLLM_WORKER_MULTIPROC_METHOD=spawn
      - NVLINK_MODE=${NVLINK_MODE:-auto}
      - NCCL_CUMEM_ENABLE=0
      - NCCL_P2P_DISABLE=1
      - VLLM_NO_USAGE_STATS=1
      - VLLM_USE_FLASHINFER_SAMPLER=1
      - OMP_NUM_THREADS=1
      - PYTORCH_CUDA_ALLOC_CONF=${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True,max_split_size_mb:512}
    shm_size: "16gb"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint:
      - /bin/bash
      - -c
      - |
        # Install patches before vllm serve
        # bash /etc/club3090/install-pr35936.sh  # skipped — upstream restructured
        bash /etc/club3090/install-pr41800.sh
        pip install pytest -q 2>/dev/null
        # NVLink auto-detection
        source /etc/club3090/detect_nvlink.sh
        if [ "$${_NVLINK_ENABLED:-0}" = "1" ]; then
          exec vllm serve $${VLLM_ENFORCE_EAGER:+--enforce-eager} "$$@"
        else
          exec vllm serve $${VLLM_ENFORCE_EAGER:+--enforce-eager} --disable-custom-all-reduce "$$@"
        fi
      - --
    command:
      - --model
      - /root/.cache/huggingface/qwen3.6-27b/autoround-int4
      - --served-model-name
      - "${MODEL_ALIAS:-qwen3.6-27b-autoround}"
      - --quantization
      - auto_round
      - --dtype
      - bfloat16
      - --tensor-parallel-size
      - "${TP:-2}"
      - --pipeline-parallel-size
      - "${PP:-1}"
      - --max-model-len
      - "${MAX_MODEL_LEN:-185000}"
      - --gpu-memory-utilization
      - "${GPU_MEMORY_UTILIZATION:-0.95}"
      - --max-num-seqs
      - "1"
      - --max-num-batched-tokens
      - "8192"
      - --trust-remote-code
      - --chat-template
      - /etc/qwen-froggeric-chat-template.jinja
      - --reasoning-parser
      - qwen3
      - --default-chat-template-kwargs
      - '{"enable_thinking": ${ENABLE_THINKING:-false}}'
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --speculative-config
      - '{"method":"dflash","model":"/root/.cache/huggingface/qwen3.6-27b/dflash","num_speculative_tokens":5}'
      - --override-generation-config
      - '{"temperature":${TEMP:-0.6},"top_p":${TOP_P:-0.95},"top_k":${TOP_K:-20},"min_p":${MIN_P:-0.0},"repetition_penalty":${REPEAT_PENALTY:-1.0}}'
      - --host
      - 0.0.0.0
      - --port
      - "8000"
